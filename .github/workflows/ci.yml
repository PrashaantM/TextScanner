name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test/package.json
      - run: npm ci
        working-directory: test
      # playwright-core, NOT playwright. test/package.json depends on
      # playwright-core, and `npx playwright install` resolves a DIFFERENT
      # package from npm at run time, pinned to whatever browser revision that
      # package's latest release wants. The two agreed until they didn't, and
      # this step then installed a revision playwright-core would not look for:
      #   Executable doesn't exist at .../chromium_headless_shell-1234/...
      # Installing through the same package the tests resolve through makes the
      # revisions agree by construction rather than by coincidence.
      - run: npx playwright-core install --with-deps chromium
        working-directory: test
      - run: node --test test/unit/*.test.js
      - run: node test/run-benchmark.js --check-regression --baseline test/baseline-2026-08-28.json --tolerance 2.0
      - run: node test/touch-interactions.js
      - run: node test/malformed-input.js
      - run: node test/exif-orientation.js
      - run: node test/move-inpaint.js
      # Native-path geometry. The unit test above pins flattenBlocks' arithmetic;
      # this drives the whole chain through the real renderer in a real browser
      # and fails on any word placed away from its fixture's ground truth.
      - run: node test/render-fidelity.js
      # Pins a documented limitation rather than an accuracy target: non-Latin
      # text must keep failing SAFELY, and the Latin control must keep working.
      - run: node test/non-latin-limitation.js
      # HEIC, the iPhone camera default. CI has no codec, so this asserts the
      # failure is graceful; the other half (it must SUCCEED on device, where
      # WKWebView does have the codec) is in the device checklist.
      - run: node test/heic-input.js
      # The web-reachable features nothing else in CI imports: both Claude tiers
      # (api.anthropic.com is mocked - never called for real, never billed), TTS,
      # and the export path.
      - run: node test/web-tier-smoke.js
      # The hand-written PDF writer. Validates structurally (every xref offset
      # must land on its own object header), semantically, and - on macOS only -
      # through CoreGraphics. A corrupt PDF has no runtime error to catch.
      - run: node test/pdf-export.js
      # The document model and library, against real IndexedDB in a real browser.
      # Covers persistence, search, folders, tags, trash, page ordering, blob
      # lifetime, scan filters, edge detection, annotations, translation history,
      # and the two untrusted-input surfaces (card rendering and note paste).
      - run: node test/library-documents.js
