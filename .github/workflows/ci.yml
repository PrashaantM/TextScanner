name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 04:20 UTC daily, for the cross-browser job below only.
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:
jobs:
  # Per-push: chromium only, exactly as before. The other two engines run on a
  # nightly schedule in the second job below - see its comment for why they are
  # deliberately NOT gating every commit.
  test:
    name: chromium (per-push)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test/package.json
      # The element-id contract, first because it needs nothing - no npm install,
      # no browser - and a broken contract should fail in seconds rather than
      # after three and a half minutes of browser gates. js/dom.js's ids are the
      # app's de-facto public interface (every browser gate below drives the app
      # through them) and until this step nothing enforced that they exist:
      # getElementById returns null rather than throwing, so a renamed id imports
      # cleanly and only breaks whichever gate happens to touch that control.
      - run: node test/dom-contract.js
      # The prefers-reduced-motion contract, also browser-free and also seconds.
      # style.css zeroes --motion-* from one block, which only works if every
      # duration comes from a token. That was asserted by a comment, and a
      # comment cannot fail: ANALYSIS.md §3.7 caught 3 of 6 declarations ignoring
      # it, and e181738's radial menu broke it again undetected. The one-line
      # grep §3.7 proposed can't be the gate - it cannot tell a violation from
      # `transition: none`, from a declaration inside the reduced-motion block,
      # or from the infinite spinner that must NOT be zeroed - so the reasoning
      # lives in the script, next to each exemption.
      - run: node test/motion-contract.js
      # The version stamp (W12), also browser-free and also seconds:
      # js/state.js's APP_VERSION is the one source of truth, and this fails
      # if the footer's rendered value drifts from it.
      - run: node test/site-metadata.js
      # This section's OWN numbers, and this workflow's own coverage - the last
      # of the browser-free gates, still seconds. Two things that were kept by
      # hand and drifted every time: WEB-COMPLETION-PLAN.md §0's module/line/
      # gate counts (parsed OUT of the markdown, so the doc stays the single
      # source), and the rule that a test/*.js gate must appear below. The
      # second half exists because test/chrome-reorganization.js sat in the
      # tree for a full commit cycle with no `run:` line and gated nothing,
      # and test/paste-placement.js had done the same since b823567.
      - run: node test/repo-contract.js
      - run: npm ci
        working-directory: test
      # playwright-core, NOT playwright. test/package.json depends on
      # playwright-core, and `npx playwright install` resolves a DIFFERENT
      # package from npm at run time, pinned to whatever browser revision that
      # package's latest release wants. The two agreed until they didn't, and
      # this step then installed a revision playwright-core would not look for:
      #   Executable doesn't exist at .../chromium_headless_shell-1234/...
      # Installing through the same package the tests resolve through makes the
      # revisions agree by construction rather than by coincidence.
      - run: npx playwright-core install --with-deps chromium
        working-directory: test
      - run: node --test test/unit/*.test.js
      - run: node test/run-benchmark.js --check-regression --baseline test/baseline-2026-08-28.json --tolerance 2.0
      # complexPic1, scored one text area at a time rather than averaged. The
      # benchmark above is an average, and an average cannot see a hole: this
      # poster was losing its pink headline AND its whole middle band while
      # staying inside the 2-point tolerance, because the lines that WERE read
      # carried the mean. Each area now has its own measured ceiling.
      - run: node test/region-coverage.js
      - run: node test/touch-interactions.js
      - run: node test/malformed-input.js
      - run: node test/exif-orientation.js
      - run: node test/move-inpaint.js
      # The buttons the interface itself points people at, as opposed to the raw
      # mode toggles every other gate drives. "View on photo ->" sent users to
      # Image format - no photo, and no "Move components" control, because
      # setMode only shows the editor toolbar in Full image - so the guided path
      # landed in the one view where nothing can be moved while move-inpaint.js
      # stayed green through the other door. Also the assertion move-inpaint.js
      # was missing: that a dragged word moves ON SCREEN and not only in the
      # object model. Both viewports, since the report came from a phone.
      - run: node test/guided-path.js
      # Delete pressed twice on the same word. The first press empties an OCR
      # word and reveals its inpainted patch; the second used to do nothing at
      # all, silently, while the Delete button sat enabled over an invisible
      # strip that still caught taps. Nothing in CI had ever pressed it twice.
      - run: node test/editor-delete.js
      # How big a replacement word renders against the text it replaces, on real
      # photos. render-fidelity.js owned font size and asserted the renderer's
      # own formula back at it, so it was green at 1.00x while every replacement
      # rendered at 0.58x the source word's height on all three corpus images.
      - run: node test/replacement-size.js
      # Whether a retyped word comes back in a face that looks like the one in
      # the photograph, scored rather than eyeballed: the page draws words in a
      # font it chose, hands the pixels to the real matcher, and compares. This
      # is the gate that overturned "font-weight detection: measured, doesn't
      # work" - which was true of the ABSOLUTE signal it was measured on (ink
      # fraction, and the stroke measurement thresholded, both ~84% at best) and
      # not of the problem. Also pins the two axes deliberately tuned for
      # precision over recall, so a later attempt to raise monospace or italic
      # recall has to move a floor on purpose rather than by accident.
      - run: node test/font-match.js
      # The result screen's chrome: the filter set is Text-mode only and
      # genuinely inert elsewhere, Download/Save as note/Add as document page
      # are one right-aligned corner menu that opens ATTACHED TO ITS BUTTON
      # (checked after scrolling - the .flow-panel transform that captured its
      # position:fixed only shows at a non-zero scroll offset), Download text
      # ignores a selection where Copy honours it, and the move handle is a
      # move icon rather than a dot indistinguishable from the resize square.
      - run: node test/chrome-reorganization.js
      # Phase 2's copy/paste: Ctrl/Cmd+C on a selected, non-editing word records
      # its RESOLVED font/size/colour and Ctrl/Cmd+V clones all of it, not just
      # the text; the same shortcut INSIDE an edited word is left to the
      # browser's own native copy/paste; and a touch long-press reaches the
      # same two actions through #text-clipboard-menu. Written in b823567 and
      # never given a `run:` line until test/repo-contract.js started failing
      # on it - it had been passing locally and gating nothing for two commits.
      - run: node test/paste-placement.js
      # The confirm in front of deleting a region OCR probably misread as a word
      # (a logo, an icon, a decorative rule), and the affordance that says so
      # first. Confidence cannot flag these - the map pin on complexPic1 comes
      # back at 89 while real text scores 51 - so the rule is geometric, and it
      # WARNS rather than filtering: it fires on 16% of regions on complexPic2,
      # far too many to suppress on. Half this gate is therefore about what did
      # NOT change: a flagged region stays editable and keeps reaching
      # Copy/Download/TTS.
      - run: node test/not-text-warning.js
      # Native-path geometry. The unit test above pins flattenBlocks' arithmetic;
      # this drives the whole chain through the real renderer in a real browser
      # and fails on any word placed away from its fixture's ground truth.
      - run: node test/render-fidelity.js
      # Pins a documented limitation rather than an accuracy target: non-Latin
      # text must keep failing SAFELY, and the Latin control must keep working.
      - run: node test/non-latin-limitation.js
      # HEIC, the iPhone camera default. CI has no codec, so this asserts the
      # failure is graceful; the other half (it must SUCCEED on device, where
      # WKWebView does have the codec) is in the device checklist.
      - run: node test/heic-input.js
      # The web-reachable features nothing else in CI imports: both Claude tiers
      # (api.anthropic.com is mocked - never called for real, never billed), TTS,
      # and the export path.
      - run: node test/web-tier-smoke.js
      # The hand-written PDF writer. Validates structurally (every xref offset
      # must land on its own object header), semantically, and - on macOS only -
      # through CoreGraphics. A corrupt PDF has no runtime error to catch.
      - run: node test/pdf-export.js
      # The document model and library, against real IndexedDB in a real browser.
      # Covers persistence, search, folders, tags, trash, page ordering, blob
      # lifetime, scan filters, edge detection, annotations, translation history,
      # and the two untrusted-input surfaces (card rendering and note paste).
      - run: node test/library-documents.js
      # Document creation timing, driven through the real nav/action-sheet UI
      # rather than the document model directly (library-documents.js's job,
      # above): a document must not exist until there is real content, the
      # one-time empty-document cleanup sweep, and the delete/Undo toast.
      - run: node test/document-creation.js
      # The interaction layer (06-INTERACTION-MODEL-SPEC.md): the radial menu
      # primitive (touch press-drag-release, reduced motion, keyboard-only
      # operation), the create-menu and card-swipe call sites, the command
      # palette, and the global keyboard shortcuts.
      - run: node test/interaction-layer.js
      # The eleven paths behind a native window.confirm/prompt, driven through
      # their real UI controls. Playwright auto-dismisses any dialog nothing is
      # listening for, so until this file NO test had ever installed a
      # page.on("dialog") handler and every one of these handlers had only ever
      # taken its "user pressed Cancel" branch in CI. Asserts all three halves:
      # OK acts, Cancel does not, and the message says what it claims to.
      # Includes "Delete all local data", the only unrecoverable action in the
      # app, which nothing automated had ever pressed.
      - run: node test/destructive-actions.js
      # Redaction, on the device rather than in the export. burnAnnotations()
      # has always composited the black boxes into the exported pixels, so every
      # existing assertion about redaction passed - while the untouched capture
      # stayed in IndexedDB under originalBlobKey, which rebuildPage re-derives
      # the page FROM on every filter, rotate and crop. Applying a redaction now
      # destroys that original, and this gate checks it by reading STORES.BLOBS
      # directly: an in-memory `destroyed: true` can be set while the bytes are
      # still there, which is the exact failure it exists to catch. Also drives
      # the restore path, because a backup taken BEFORE a destruction still
      # contains the original and the importer's job is to add blobs it lacks.
      - run: node test/redaction-destroys-original.js
      # PII detection over a scan-doc page's real OCR words (page.words), the
      # bridge that turns a detected candidate's bbox into a redaction box in
      # the page's own normalized coordinate space, and the one-tap flow that
      # hands selected candidates to the SAME redact/destroy path gate 28
      # already covers - no second, parallel redaction mechanism. Detection
      # accuracy is checked against the real 11-image benchmark corpus first
      # (one image, complexPic3, has real PII-shaped ground truth; the gate
      # states plainly that today's OCR quality on it is too poor to find it -
      # a real, stated negative result, not a bug) and then against synthetic
      # text run through the real OCR engine (labeled as synthetic, not
      # corpus evidence). The coordinate bridge is checked on a page that has
      # actually been rotated, against an INDEPENDENT ground truth computed by
      # a plain pixel-darkness scan - not merely the code checked against
      # itself.
      - run: node test/pii-redaction.js
      # All three radial call sites, at both sides of the 600px breakpoint.
      # interaction-layer.js covers call sites 1 and 2 and never touches call
      # site 3 (#theme-btn) - the one the interaction spec's own rollout order
      # puts first - and sets no viewport, so it had never seen the breakpoint
      # where style.css hides controls. That combination hid two things: the
      # theme radial being absent on every phone, and call site 3 accepting a
      # mouse press-and-hold while call site 1 correctly refused one.
      - run: node test/radial-call-sites.js
      # Inpaint reconstruction quality, against ground truth the test holds (the
      # background captured before text was drawn over it). Two metrics, because
      # mean per-pixel error alone is misleading on stochastic texture: a fill
      # that puts back convincing wood grain in different places scores worse
      # than a flat blur while looking incomparably better.
      - run: node test/inpaint-fidelity.js
      # The library backup, end to end: build a library, back it up, run the
      # real "Delete all local data", import, and assert both the documents AND
      # a full-text search for a word that exists only inside a scanned page
      # come back. Plus a canary: an API key is saved before the export and the
      # serialized bytes are searched for it, because a library backup is
      # exactly the file someone emails themselves or drops in a synced folder.
      - run: node test/backup-roundtrip.js
      # W1's service worker, with the network genuinely gone. Three layered
      # mechanisms rather than one, because the weak version of this test is the
      # one that passes while proving nothing: context.setOffline(true), a
      # SERVER-SIDE WITNESS that fails the run if anything at all reached the
      # static server during an offline step, and finally the server socket
      # closed outright so no emulation is being trusted. page.route() abort is
      # deliberately NOT used - requests issued by a service worker are not
      # reliably subject to it, so the component under test could have gone on
      # fetching for real behind a green gate.
      # Also pins the two cache buckets as buckets: the 6.7 MB recognition payload
      # (wasm core + tessdata) must be ABSENT before the first scan, because
      # precaching 11 MB of vendor/tesseract at install would make first load
      # hostile, and PRESENT after it. And it asserts sw.js's precache manifest
      # against `ls js/*.js` in BOTH directions - a service worker cannot glob a
      # directory, so that list is the one place in the repo restating what js/
      # contains, and it is what rots the next time a module is renamed.
      # The escape hatch is asserted here too, which is what protects the 32
      # gates above: a plain http:// load must leave the page uncontrolled with
      # no registration and no cache at all.
      - run: node test/offline.js
      # The user-facing half of the offline story, which offline.js above does not
      # cover: sw.js caches the recognition payload on the first SUCCESSFUL scan,
      # so a fresh PWA install that has never scanned online cannot scan offline.
      # README said so and the app did nothing about it - the person it happens to
      # got "Reload the page and try again", advice that is actively wrong because
      # reloading changes nothing. This pins the specific message, and Settings'
      # "Make recognition work offline" control reporting the ACTUAL cache state
      # in each of its five distinguishable situations.
      # The assertion that makes the rest worth anything: it warms the cache
      # through the control with NO prior scan, goes offline, and scans. The
      # worker appends its own core filename after runtime SIMD detection and
      # js/ocrEngine.js only hands it a directory, so caching the wrong core would
      # leave a device that had just been told "recognition works offline now"
      # reaching for the network - invisible to any check that merely counts three
      # files in a cache, and caught here.
      # Also the quota path: the cache-write fixes made sw.js survive a refused
      # put silently, which is right for a scan and means "the download finished"
      # proves nothing about what was stored. The control re-reads the cache and
      # must not report success when nothing was saved.
      - run: node test/offline-recognition.js

  # ---------------------------------------------------------------------------
  # Nightly only, and that is a deliberate choice rather than a lack of nerve.
  #
  # The app ships to Safari and Firefox users and had never been executed in
  # either until test/browser.js was added. WebKit coverage matters twice over,
  # because it is the same engine family as the iOS WKWebView the native build
  # runs inside - a WebKit divergence is very likely an iOS one.
  #
  # But these do NOT gate every push. Playwright's WebKit build is timing-flaky
  # around exactly this app's hottest paths (canvas toBlob, IndexedDB commit),
  # and a per-push gate that goes red for reasons nobody can act on teaches
  # everyone to re-run until green - which costs the per-push signal the meaning
  # it exists to have. Nightly catches real divergence without that cost.
  #
  # touch-interactions.js skips itself here with a stated reason: it needs CDP
  # Input.dispatchTouchEvent for genuine trusted touch, and CDP is Chromium-only.
  #
  # MEASURED STATE OF THIS JOB, 2026-09-19, on a local WebKit run of every gate
  # below: 16 pass, 5 fail. The 5 are PRE-EXISTING WebKit divergences, not
  # regressions - each was reproduced at ebb119d with the same failure text:
  #
  #   move-inpaint, render-fidelity  - NOT an app defect. Playwright's own
  #     screenshotter injects `<style>body {}</style>` to force a style recalc
  #     before an ELEMENT screenshot (screenshotter.ts,
  #     inPagePrepareForScreenshots, the syncAnimations branch), and
  #     `style-src 'self'` refuses it. These two gates are the only ones here
  #     that call locator.screenshot(); the other 19 take none, which is
  #     exactly the failure set. Isolated: page.screenshot() does NOT fire it,
  #     locator.screenshot() does, and Chromium does not fire it at all.
  #     The violation reports blockedURI "inline",
  #     effectiveDirective "style-src-elem", and no <style> element is in the
  #     DOM when it fires - the element is refused, and it carries no
  #     declarations anyway.
  #
  #     CORRECTION, recorded rather than quietly replaced: the first version of
  #     this comment called these "the same CSP-vs-style family as ebb119d's
  #     redaction boxes". That was a guess and it was wrong. ebb119d fixed an
  #     inline style ATTRIBUTE in app code (style-src-attr); this is a
  #     style ELEMENT injected by the test harness (style-src-elem). Different
  #     directive, different source, and nothing in js/ or index.html is
  #     involved - index.html has no <style>, and its only stylesheet is the
  #     same-origin <link href="style.css"> that style-src 'self' permits.
  #
  #   library-documents              - X4. The failing assertion is
  #     test/library-documents.js:513, check("noise is refused rather than
  #     guessed at", edges.noiseFound === false). This is the tracked item in
  #     WEB-COMPLETION-PLAN.md §X4 ("Edge detection hallucinates a page in pure
  #     noise, on every engine but Chromium", plan line 451), which §0 at plan
  #     line 447 calls out as "new and real". Fixing it is a threshold change
  #     under test/TUNING-2.md's merge rule - do not tighten it here.
  #
  #   document-creation, destructive-actions - assertion failures, source not
  #     investigated.
  #
  # Separately, the Tesseract wasm `data:` URI connect-src violation that used
  # to fail EVERY OCR gate here is now allowed by one exact pattern in
  # test/browser.js, which carries the measurement showing recognition is
  # byte-identical with and without it. So a red nightly means one of the five
  # above (or something new) - it no longer means "WebKit logged a CSP line".
  cross-browser:
    name: ${{ matrix.browser }} (nightly)
    runs-on: ubuntu-latest
    # Schedule and manual dispatch ONLY. Never on push, never on a PR - that is
    # the whole point of splitting it out.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test/package.json
      - run: npm ci
        working-directory: test
      - run: npx playwright-core install --with-deps ${{ matrix.browser }}
        working-directory: test
      # The two contract gates need no browser, so they are not repeated here.
      - run: node test/malformed-input.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/exif-orientation.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/move-inpaint.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/guided-path.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/editor-delete.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/replacement-size.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/not-text-warning.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/render-fidelity.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/region-coverage.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/non-latin-limitation.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/heic-input.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/web-tier-smoke.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/pdf-export.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/library-documents.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/document-creation.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/interaction-layer.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/destructive-actions.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/radial-call-sites.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/inpaint-fidelity.js
        env: { BROWSER: "${{ matrix.browser }}" }
      # Skips itself on WebKit, which cannot store a Blob in IndexedDB in
      # Playwright's build - see test/browser.js and §4.3.
      - run: node test/backup-roundtrip.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/touch-interactions.js
        env: { BROWSER: "${{ matrix.browser }}" }
