name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 04:20 UTC daily, for the cross-browser job below only.
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:
jobs:
  # Per-push: chromium only, exactly as before. The other two engines run on a
  # nightly schedule in the second job below - see its comment for why they are
  # deliberately NOT gating every commit.
  test:
    name: chromium (per-push)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test/package.json
      # The element-id contract, first because it needs nothing - no npm install,
      # no browser - and a broken contract should fail in seconds rather than
      # after three and a half minutes of browser gates. js/dom.js's ids are the
      # app's de-facto public interface (every browser gate below drives the app
      # through them) and until this step nothing enforced that they exist:
      # getElementById returns null rather than throwing, so a renamed id imports
      # cleanly and only breaks whichever gate happens to touch that control.
      - run: node test/dom-contract.js
      # The prefers-reduced-motion contract, also browser-free and also seconds.
      # style.css zeroes --motion-* from one block, which only works if every
      # duration comes from a token. That was asserted by a comment, and a
      # comment cannot fail: ANALYSIS.md §3.7 caught 3 of 6 declarations ignoring
      # it, and e181738's radial menu broke it again undetected. The one-line
      # grep §3.7 proposed can't be the gate - it cannot tell a violation from
      # `transition: none`, from a declaration inside the reduced-motion block,
      # or from the infinite spinner that must NOT be zeroed - so the reasoning
      # lives in the script, next to each exemption.
      - run: node test/motion-contract.js
      - run: npm ci
        working-directory: test
      # playwright-core, NOT playwright. test/package.json depends on
      # playwright-core, and `npx playwright install` resolves a DIFFERENT
      # package from npm at run time, pinned to whatever browser revision that
      # package's latest release wants. The two agreed until they didn't, and
      # this step then installed a revision playwright-core would not look for:
      #   Executable doesn't exist at .../chromium_headless_shell-1234/...
      # Installing through the same package the tests resolve through makes the
      # revisions agree by construction rather than by coincidence.
      - run: npx playwright-core install --with-deps chromium
        working-directory: test
      - run: node --test test/unit/*.test.js
      - run: node test/run-benchmark.js --check-regression --baseline test/baseline-2026-08-28.json --tolerance 2.0
      - run: node test/touch-interactions.js
      - run: node test/malformed-input.js
      - run: node test/exif-orientation.js
      - run: node test/move-inpaint.js
      # Native-path geometry. The unit test above pins flattenBlocks' arithmetic;
      # this drives the whole chain through the real renderer in a real browser
      # and fails on any word placed away from its fixture's ground truth.
      - run: node test/render-fidelity.js
      # Pins a documented limitation rather than an accuracy target: non-Latin
      # text must keep failing SAFELY, and the Latin control must keep working.
      - run: node test/non-latin-limitation.js
      # HEIC, the iPhone camera default. CI has no codec, so this asserts the
      # failure is graceful; the other half (it must SUCCEED on device, where
      # WKWebView does have the codec) is in the device checklist.
      - run: node test/heic-input.js
      # The web-reachable features nothing else in CI imports: both Claude tiers
      # (api.anthropic.com is mocked - never called for real, never billed), TTS,
      # and the export path.
      - run: node test/web-tier-smoke.js
      # The hand-written PDF writer. Validates structurally (every xref offset
      # must land on its own object header), semantically, and - on macOS only -
      # through CoreGraphics. A corrupt PDF has no runtime error to catch.
      - run: node test/pdf-export.js
      # The document model and library, against real IndexedDB in a real browser.
      # Covers persistence, search, folders, tags, trash, page ordering, blob
      # lifetime, scan filters, edge detection, annotations, translation history,
      # and the two untrusted-input surfaces (card rendering and note paste).
      - run: node test/library-documents.js
      # Document creation timing, driven through the real nav/action-sheet UI
      # rather than the document model directly (library-documents.js's job,
      # above): a document must not exist until there is real content, the
      # one-time empty-document cleanup sweep, and the delete/Undo toast.
      - run: node test/document-creation.js
      # The interaction layer (06-INTERACTION-MODEL-SPEC.md): the radial menu
      # primitive (touch press-drag-release, reduced motion, keyboard-only
      # operation), the create-menu and card-swipe call sites, the command
      # palette, and the global keyboard shortcuts.
      - run: node test/interaction-layer.js
      # The eleven paths behind a native window.confirm/prompt, driven through
      # their real UI controls. Playwright auto-dismisses any dialog nothing is
      # listening for, so until this file NO test had ever installed a
      # page.on("dialog") handler and every one of these handlers had only ever
      # taken its "user pressed Cancel" branch in CI. Asserts all three halves:
      # OK acts, Cancel does not, and the message says what it claims to.
      # Includes "Delete all local data", the only unrecoverable action in the
      # app, which nothing automated had ever pressed.
      - run: node test/destructive-actions.js
      # All three radial call sites, at both sides of the 600px breakpoint.
      # interaction-layer.js covers call sites 1 and 2 and never touches call
      # site 3 (#theme-btn) - the one the interaction spec's own rollout order
      # puts first - and sets no viewport, so it had never seen the breakpoint
      # where style.css hides controls. That combination hid two things: the
      # theme radial being absent on every phone, and call site 3 accepting a
      # mouse press-and-hold while call site 1 correctly refused one.
      - run: node test/radial-call-sites.js
      # Inpaint reconstruction quality, against ground truth the test holds (the
      # background captured before text was drawn over it). Two metrics, because
      # mean per-pixel error alone is misleading on stochastic texture: a fill
      # that puts back convincing wood grain in different places scores worse
      # than a flat blur while looking incomparably better.
      - run: node test/inpaint-fidelity.js

  # ---------------------------------------------------------------------------
  # Nightly only, and that is a deliberate choice rather than a lack of nerve.
  #
  # The app ships to Safari and Firefox users and had never been executed in
  # either until test/browser.js was added. WebKit coverage matters twice over,
  # because it is the same engine family as the iOS WKWebView the native build
  # runs inside - a WebKit divergence is very likely an iOS one.
  #
  # But these do NOT gate every push. Playwright's WebKit build is timing-flaky
  # around exactly this app's hottest paths (canvas toBlob, IndexedDB commit),
  # and a per-push gate that goes red for reasons nobody can act on teaches
  # everyone to re-run until green - which costs the per-push signal the meaning
  # it exists to have. Nightly catches real divergence without that cost.
  #
  # touch-interactions.js skips itself here with a stated reason: it needs CDP
  # Input.dispatchTouchEvent for genuine trusted touch, and CDP is Chromium-only.
  cross-browser:
    name: ${{ matrix.browser }} (nightly)
    runs-on: ubuntu-latest
    # Schedule and manual dispatch ONLY. Never on push, never on a PR - that is
    # the whole point of splitting it out.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test/package.json
      - run: npm ci
        working-directory: test
      - run: npx playwright-core install --with-deps ${{ matrix.browser }}
        working-directory: test
      # The two contract gates need no browser, so they are not repeated here.
      - run: node test/malformed-input.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/exif-orientation.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/move-inpaint.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/render-fidelity.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/non-latin-limitation.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/heic-input.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/web-tier-smoke.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/pdf-export.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/library-documents.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/document-creation.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/interaction-layer.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/destructive-actions.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/radial-call-sites.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/inpaint-fidelity.js
        env: { BROWSER: "${{ matrix.browser }}" }
      - run: node test/touch-interactions.js
        env: { BROWSER: "${{ matrix.browser }}" }
